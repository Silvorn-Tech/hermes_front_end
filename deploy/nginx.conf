server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Baseline hardening for a static SPA behind Tailscale-terminated TLS.
    # No CSP here: Expo Web's exported bundle needs profiling before a
    # restrictive policy can be written without breaking it.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Hashed filenames under _expo/static/** are content-addressed and safe to cache forever.
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html /index.html;
    }
}
